name: Daily signal

# GitHub queues scheduled runs at low priority: 5-20 min late is routine and a
# run can be dropped outright under load. So every slot is placed with ~45 min
# of slack before the 15:50 ET MOC cutoff, minutes are off the round numbers
# everyone else schedules on, and there are several slots so one miss is
# survivable.
#   13:07 UTC = 09:07 EDT / 08:07 EST   morning preview (yesterday's close)
#   18:07 UTC = 14:07 EDT / 13:07 EST   early check
#   19:07 UTC = 15:07 EDT / 14:07 EST   action window (summer: 43 min of slack)
#   20:07 UTC = 16:07 EDT / 15:07 EST   action window (winter); skipped in summer
# The job exits early once the ET clock is past 16:00, so a post-close run can
# never overwrite the last actionable one.
on:
  schedule:
    - cron: "7 13 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "7 19 * * 1-5"
    - cron: "7 20 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Capital to size the order against"
        default: "20000"

permissions:
  issues: write

concurrency: daily-signal          # a slow run can't be overtaken by the next slot

jobs:
  signal:
    runs-on: ubuntu-latest
    env:
      TITLE: "Today's QQQ overnight decision"
      CAPITAL: ${{ inputs.capital || '20000' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if the close has already passed
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "$H" -ge 16 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "It is ${H}:xx ET — past the close, nothing actionable. Skipping."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.skip != 'true'

      - uses: astral-sh/setup-uv@v5
        if: env.skip != 'true'
        with:
          enable-cache: true

      - name: Run the signal
        if: env.skip != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          uv run --frozen python scripts/today.py --capital "$CAPITAL" | tee signal.txt

      - name: Post it to the pinned issue
        if: env.skip != 'true'
        run: |
          {
            echo "## $(TZ=America/New_York date '+%a %d %b %Y, %-I:%M %p ET')"
            echo
            echo '```'
            cat signal.txt
            echo '```'
            echo
            echo "The decision line above is dated by the **last QQQ close available**."
            echo "Same date as today → final. Yesterday → morning preview; the"
            echo "~15:40 ET run confirms it. A preview only flips if QQQ crosses its"
            echo "200-day average intraday, and the gap to that average is printed above."
            echo
            echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > body.md

          cat body.md >> "$GITHUB_STEP_SUMMARY"

          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file body.md
          else
            gh issue edit "$NUM" --body-file body.md
          fi
